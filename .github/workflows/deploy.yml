name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Building with base-href: /${REPO_NAME}/"
          npx ng build --configuration github-pages --base-href /${REPO_NAME}/

      - name: Copy supporting files
        run: |
          if [ -f public/404.html ]; then
            cp public/404.html dist/xmlSurveyEditor/browser/404.html
          fi
          if [ -f public/.nojekyll ]; then
            cp public/.nojekyll dist/xmlSurveyEditor/browser/.nojekyll
          else
            touch dist/xmlSurveyEditor/browser/.nojekyll
          fi
          
      - name: Verify base href
        run: |
          if [ -f dist/xmlSurveyEditor/browser/index.html ]; then
            echo "Checking index.html base href:"
            grep -o '<base href="[^"]*"' dist/xmlSurveyEditor/browser/index.html || echo "No base tag found"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/xmlSurveyEditor/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

