name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Building with base-href: /${REPO_NAME}/"
          npx ng build --configuration github-pages --base-href /${REPO_NAME}/

      - name: Copy supporting files
        run: |
          # Copy index.html to 404.html so GitHub Pages serves the Angular app for 404s
          if [ -f dist/xmlSurveyEditor/browser/index.html ]; then
            cp dist/xmlSurveyEditor/browser/index.html dist/xmlSurveyEditor/browser/404.html
            echo "Copied index.html to 404.html"
          fi
          # Ensure .nojekyll exists
          if [ -f public/.nojekyll ]; then
            cp public/.nojekyll dist/xmlSurveyEditor/browser/.nojekyll
          else
            touch dist/xmlSurveyEditor/browser/.nojekyll
          fi
          
      - name: Verify build output
        run: |
          echo "Listing build output directory:"
          ls -la dist/xmlSurveyEditor/browser/ || echo "Directory not found"
          echo ""
          echo "Checking index.html base href:"
          if [ -f dist/xmlSurveyEditor/browser/index.html ]; then
            grep -o '<base href="[^"]*"' dist/xmlSurveyEditor/browser/index.html || echo "No base tag found"
            echo ""
            echo "First few lines of index.html:"
            head -n 10 dist/xmlSurveyEditor/browser/index.html
          else
            echo "ERROR: index.html not found!"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/xmlSurveyEditor/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

