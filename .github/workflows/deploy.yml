name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Building with base-href: /${REPO_NAME}/"
          echo "Using production configuration with static output..."
          # Build with production config, output to browser directory, set static mode
          npx ng build --configuration production --base-href /${REPO_NAME}/ --output-path dist/xmlSurveyEditor --output-mode static

      - name: Find and move build files
        run: |
          echo "Checking build output structure..."
          echo "Contents of dist/xmlSurveyEditor:"
          ls -la dist/xmlSurveyEditor/ || echo "Directory not found"
          echo ""
          # Find where index.html actually is
          if [ -f dist/xmlSurveyEditor/browser/index.html ]; then
            echo "Found index.html in dist/xmlSurveyEditor/browser/"
            BUILD_DIR="dist/xmlSurveyEditor/browser"
          elif [ -f dist/xmlSurveyEditor/index.html ]; then
            echo "Found index.html in dist/xmlSurveyEditor/"
            BUILD_DIR="dist/xmlSurveyEditor"
          else
            echo "Searching for index.html..."
            find dist -name "index.html" -type f | head -5
            BUILD_DIR=$(find dist -name "index.html" -type f | head -1 | xargs dirname)
            echo "Using build directory: ${BUILD_DIR}"
          fi
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV

      - name: Copy supporting files
        run: |
          if [ -f "$BUILD_DIR/index.html" ]; then
            # Copy index.html to 404.html so GitHub Pages serves the Angular app for 404s
            cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
            echo "Copied index.html to 404.html"
          fi
          # Ensure .nojekyll exists
          if [ -f public/.nojekyll ]; then
            cp public/.nojekyll "$BUILD_DIR/.nojekyll"
          else
            touch "$BUILD_DIR/.nojekyll"
          fi
          
      - name: Verify build output
        run: |
          echo "=== Build Output Verification ==="
          echo "Repository name: ${{ github.event.repository.name }}"
          echo "Build directory: $BUILD_DIR"
          echo ""
          echo "Listing build output directory:"
          ls -la "$BUILD_DIR/" || echo "Directory not found"
          echo ""
          echo "Checking for key files:"
          [ -f "$BUILD_DIR/index.html" ] && echo "✓ index.html exists" || echo "✗ index.html MISSING"
          [ -f "$BUILD_DIR/404.html" ] && echo "✓ 404.html exists" || echo "✗ 404.html MISSING"
          [ -f "$BUILD_DIR/.nojekyll" ] && echo "✓ .nojekyll exists" || echo "✗ .nojekyll MISSING"
          echo ""
          echo "Checking index.html base href:"
          if [ -f "$BUILD_DIR/index.html" ]; then
            BASE_HREF=$(grep -o '<base href="[^"]*"' "$BUILD_DIR/index.html" | head -1)
            echo "Base href found: ${BASE_HREF}"
            if [[ ! "$BASE_HREF" == *"XMLSurveyEditor"* ]]; then
              echo "⚠️  WARNING: Base href doesn't contain XMLSurveyEditor!"
            fi
            echo ""
            echo "First 15 lines of index.html:"
            head -n 15 "$BUILD_DIR/index.html"
            echo ""
            echo "Checking 404.html (should match index.html):"
            if [ -f "$BUILD_DIR/404.html" ]; then
              diff -q "$BUILD_DIR/index.html" "$BUILD_DIR/404.html" && echo "✓ 404.html matches index.html" || echo "⚠️  404.html differs from index.html"
            fi
          else
            echo "ERROR: index.html not found!"
            exit 1
          fi
          echo ""
          echo "JavaScript files in build:"
          ls -1 "$BUILD_DIR"/*.js 2>/dev/null | head -5 || echo "No JS files found"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}
          
      - name: Verify artifact contents
        run: |
          echo "=== Artifact Verification ==="
          echo "This step verifies the artifact was created correctly"
          echo "Check the 'Upload artifact' step above for details"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

