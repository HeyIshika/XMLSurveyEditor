<div style="display:flex; gap:20px; padding:16px;">
  <!-- LEFT: Document / Questions editor -->
  <div style="flex:1;">
    <h3>Document (editable)</h3>
    <div style="margin-bottom:8px; display:flex; gap:8px; align-items:center;">
      <input type="file" accept=".docx,.txt" (change)="uploadDoc($event)" />
      <button (click)="downloadDoc()">Download Document</button>
    </div>

    <textarea
      [(ngModel)]="docText"
      (input)="updateXML()"
      rows="24"
      style="width:100%; font-family:monospace; padding:10px; resize:vertical; border:1px solid #ccc; border-radius:4px;"
      placeholder="Upload a .docx or paste the survey draft text here."
    ></textarea>
  </div>

  <!-- RIGHT: XML Editor -->
  <div style="flex:1;">
    <h3>XML (editable)</h3>
    <div style="margin-bottom:8px; display:flex; gap:8px; align-items:center;">
      <input type="file" accept=".xml" (change)="uploadXML($event)" />
      <button (click)="downloadXML()">Download XML</button>
    </div>

    <textarea
      [(ngModel)]="xmlText"
      (input)="updateDocument()"
      rows="24"
      style="width:100%; font-family:monospace; padding:10px; resize:vertical; background:#fafafa; border:1px solid #ccc; border-radius:4px;"
      placeholder="Generated survey XML will appear here. You can edit it directly."
    ></textarea>
  </div>
</div>
