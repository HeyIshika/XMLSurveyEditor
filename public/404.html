<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XmlSurveyEditor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Redirect to index.html - simple one-time redirect
    var path = window.location.pathname;
    var repoName = path.split('/').filter(Boolean)[0] || '';
    var basePath = '/' + repoName + '/';
    
    // Only redirect once, avoid loops
    if (path !== basePath + 'index.html') {
      window.location.replace(basePath + 'index.html' + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
